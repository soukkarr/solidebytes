<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- "Bit" — the SolideBytes mascot: a liquid-chrome byte with eyes -->
  <defs>
    <linearGradient id="sbTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#DDE2E9"/>
      <stop offset="1" stop-color="#A9B1BC"/>
    </linearGradient>
    <linearGradient id="sbLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F5F8"/>
      <stop offset=".42" stop-color="#AEB5BF"/>
      <stop offset=".5" stop-color="#3E444D"/>
      <stop offset=".72" stop-color="#7D8590"/>
      <stop offset="1" stop-color="#E4E8ED"/>
    </linearGradient>
    <linearGradient id="sbRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7CDD5"/>
      <stop offset=".38" stop-color="#7A818C"/>
      <stop offset=".46" stop-color="#22262C"/>
      <stop offset=".7" stop-color="#4F5660"/>
      <stop offset="1" stop-color="#A3AAB4"/>
    </linearGradient>
    <radialGradient id="sbShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="32" cy="60" rx="20" ry="3.2" fill="url(#sbShadow)"/>
  <g stroke-linejoin="round" stroke-width="2.4">
    <path d="M32 5 L56 19 L32 33 L8 19 Z" fill="url(#sbTop)" stroke="url(#sbTop)"/>
    <path d="M8 19 L32 33 L32 58 L8 44 Z" fill="url(#sbLeft)" stroke="url(#sbLeft)"/>
    <path d="M32 33 L56 19 L56 44 L32 58 Z" fill="url(#sbRight)" stroke="url(#sbRight)"/>
  </g>
  <!-- rim light along the edges -->
  <path d="M8 19 L32 33 L56 19 M32 33 L32 58" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1" stroke-linecap="round"/>
  <clipPath id="sbTopClip"><path d="M32 5 L56 19 L32 33 L8 19 Z"/></clipPath>
  <ellipse cx="28" cy="15" rx="8" ry="2.4" fill="#fff" opacity=".8" transform="rotate(30 28 15)" clip-path="url(#sbTopClip)"/>
  <!-- eyes -->
  <g class="sb-eyes">
    <g transform="translate(24 40) skewY(30)">
      <ellipse rx="3.1" ry="4.4" fill="#0D0F14"/>
      <circle cx="1" cy="-1.8" r="1.2" fill="#fff"/>
    </g>
    <g transform="translate(40 40) skewY(-30)">
      <ellipse rx="3.1" ry="4.4" fill="#0D0F14"/>
      <circle cx="1" cy="-1.8" r="1.2" fill="#fff"/>
    </g>
  </g>
</svg>
